<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Dragones</title>
<style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1d1b2a; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #game { width: 100%; height: 100%; }
      canvas { image-rendering: pixelated; display: block; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #1d1b2a; color: #f2c230; font: 16px 'Silkscreen', monospace; z-index: 10; }
      #loading .bar { width: 160px; height: 10px; border: 2px solid #f2c230; padding: 2px; box-sizing: border-box; }
      #loading .bar i { display: block; height: 100%; width: 30%; background: #e8542a; animation: load 1s steps(8) infinite; }
      @keyframes load { from { margin-left: 0 } to { margin-left: 70% } }
      @media (prefers-reduced-motion: reduce) { #loading .bar i { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="loading" role="status" aria-label="Loading"><span>DRAGON SURVIVOR</span><div class="bar"><i></i></div></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
